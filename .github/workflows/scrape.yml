# Every morning: pick a random website from the menu, scrape it,
# make a social media post image, and save everything in the results/ folder.
name: Daily data drop

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC (07:00 Lagos time)
  workflow_dispatch:       # adds a "Run workflow" button to run it any time

permissions:
  contents: write          # lets the robot save results into this project

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install helper tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape a random website
        run: python daily.py

      - name: Save results to GitHub
        run: |
          git config user.name "Solvix"
          git config user.email "174953671+vincent001100@users.noreply.github.com"
          git add results
          git commit -m "Daily data drop $(date -u +%Y-%m-%d)"
          git push

      - name: Post to Facebook and Instagram
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python post_social.py

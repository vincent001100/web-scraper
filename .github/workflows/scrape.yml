# Runs the scraper automatically on GitHub's computers.
# Results appear on the "Actions" tab, under each run, as a downloadable zip.
name: Daily scrape

on:
  schedule:
    - cron: "0 6 * * *"   # every day at 06:00 UTC (07:00 Lagos time)
  workflow_dispatch:       # adds a "Run workflow" button to run it any time

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install helper tools
        run: pip install -r requirements.txt

      - name: Scrape books
        run: python scraper.py books

      - name: Scrape quotes
        run: python scraper.py quotes

      - name: Save results for download
        uses: actions/upload-artifact@v7
        with:
          name: scraped-data
          path: "*.csv"
          retention-days: 30

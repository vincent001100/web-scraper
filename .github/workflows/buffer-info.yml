# Read-only: lists a Buffer account's channels and the post settings Buffer's API accepts (for Pinterest).
name: Buffer info
on:
  workflow_dispatch:
    inputs:
      which:
        description: "Which Buffer account"
        type: choice
        default: pet-shelf
        options: [pet-shelf, pinterest, solvix]
permissions:
  contents: read
jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - name: Ask Buffer (read-only)
        env:
          WHICH: ${{ inputs.which }}
          PET_SHELF_BUFFER_API_KEY: ${{ inputs.which == 'pet-shelf' && secrets.PET_SHELF_BUFFER_API_KEY || '' }}
          PINTEREST_BUFFER_API_KEY: ${{ inputs.which == 'pinterest' && secrets.PINTEREST_BUFFER_API_KEY || '' }}
          BUFFER_API_KEY: ${{ inputs.which == 'solvix' && secrets.BUFFER_API_KEY || '' }}
        run: python buffer_info.py
